{% extends 'base.html' %}
{% block title %}Upload · SecureShare{% endblock %}
{% block content %}
<section class="content-header">
    <p class="eyebrow">ENCRYPTED TRANSFER</p>
    <h1>Upload a file</h1>
    <p class="muted">Choose a receiver and a file. SecureShare will encrypt the file before storing it.</p>
</section>
<section class="panel form-panel">
    <form method="post" enctype="multipart/form-data" class="clean-form">
        <label>Receiver
            <select name="receiver_id" required>
                <option value="">Select a registered user</option>
                {% for user in users %}
                    <option value="{{ user.id }}">{{ user.username }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Choose file
            <input type="file" name="file" required>
        </label>
        <div class="security-note">🔒 Your file will be encrypted using AES-256 before it is saved.</div>
        <button class="primary-button">Encrypt and share</button>
    </form>
</section>
{% endblock %}
